version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: fidelity-postgres
    environment:
      POSTGRES_DB: fidelity_db
      POSTGRES_USER: fidelity_user
      POSTGRES_PASSWORD: fidelity_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fidelity-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: fidelity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - portfolio-service-app

  portfolio-service-app:
    image: fidelity-portfolio-service:1.0
    container_name: fidelity-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fidelity_db
      SPRING_DATASOURCE_USERNAME: fidelity_user
      SPRING_DATASOURCE_PASSWORD: fidelity_pass
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: fidelity-super-secret-key-minimum-32-characters-long
      JWT_EXPIRATION: 86400000
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: