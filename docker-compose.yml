version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: fidelity-postgres
    environment:
      POSTGRES_DB: fidelity_db
      POSTGRES_USER: fidelity_user
      POSTGRES_PASSWORD: fidelity_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fidelity-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: