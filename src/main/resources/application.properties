spring.application.name=portfolio-service
server.port=8081

# Database - we will set up Docker PostgreSQL next
spring.datasource.url=jdbc:postgresql://localhost:5432/fidelity_db
spring.datasource.username=fidelity_user
spring.datasource.password=fidelity_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.com.fidelity=DEBUG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration