spring.application.name=portfolio-service
server.port=8081

# Database - we will set up Docker PostgreSQL next
spring.datasource.url=jdbc:postgresql://localhost:5432/fidelity_db
spring.datasource.username=fidelity_user
spring.datasource.password=fidelity_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging
logging.level.com.fidelity=DEBUG

# JWT Configuration
jwt.secret=fidelity-super-secret-key-minimum-32-characters-long
jwt.expiration=86400000

# Actuator ? expose all endpoints including prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# App info shown in /actuator/info
info.app.name=Fidelity Portfolio Service
info.app.version=1.0.0
info.app.description=Brokerage Microservices Platform

# OpenAI Configuration
openai.api.key=your-openai-api-key-here
openai.model=gpt-3.5-turbo
openai.max-tokens=500